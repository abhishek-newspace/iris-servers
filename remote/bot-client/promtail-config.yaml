server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /etc/promtail/positions.yaml  # Use mounted folder, survives restarts

clients:
  - url: http://192.168.0.89:3100/loki/api/v1/push  # ← your Loki IP/port

scrape_configs:
# --- ROS log scraping (fixed with labels) ---
- job_name: rasp-pi-logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: rasp-pi-logs
      host: raspberrypi
      __path__: /logs/**/*.log
      type: ros   # << extra label to guarantee at least one label

# --- Docker container logs (for container rpi) ---
- job_name: docker
  docker_sd_configs:
    - host: unix:///var/run/docker.sock
      refresh_interval: 10s
  relabel_configs:
    - source_labels: [__meta_docker_container_name]
      target_label: container_name
      regex: "/(.*)"
      replacement: "$1"

    - source_labels: [__meta_docker_container_id]
      target_label: container_id

    - source_labels: [__meta_docker_container_log_stream]
      target_label: stream

    - source_labels: [__meta_docker_container_name]
      regex: "/rpi"
      action: keep
