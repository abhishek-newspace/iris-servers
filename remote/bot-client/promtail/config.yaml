server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://192.168.0.89:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    relabel_configs:
      # container name without leading /
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container_name
        replacement: "$1"

      # Docker container ID
      - source_labels: [__meta_docker_container_id]
        target_label: container_id

      # Docker log stream (stdout/stderr)
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

      # Required label to prevent 400
      - action: replace
        target_label: job
        replacement: docker

      # Device labels from entrypoint env vars
      - action: replace
        target_label: device_serial
        replacement: "${DEVICE_SERIAL}"

      - action: replace
        target_label: device_type
        replacement: "${DEVICE_TYPE}"

      # Optional: only keep ROS container logs
      - source_labels: [__meta_docker_container_name]
        regex: "/ros"
        action: keep
    
    static_configs:
      - targets: ["localhost"]
        labels:
          job: docker-fallback

