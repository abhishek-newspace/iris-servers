events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. Catch unencrypted HTTP traffic and upgrade it to HTTPS instantly
    server {
        listen 80;
        server_name 10.10.60.250 localhost;
        return 301 https://$host$request_uri;
    }

    # 2. Secure HTTPS Proxy Routing Matrix
    server {
        listen 443 ssl;
        server_name 10.10.60.250 localhost;

        # Target your local self-signed SSL keys
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Route Frontend requests + Dynamically alter hardcoded pre-built image variables
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent frontend compression so Nginx can read text mid-flight
            proxy_set_header Accept-Encoding "";

            # 💡 FIXED MATRIX: Drops /api/v1 to prevent duplicate pathing errors
            sub_filter 'http://localhost:8081' 'https://10.10.60.250/auth';
            
            # FIXED: Removed the trailing space that was breaking the frontend API calls
            sub_filter 'http://192.168.0.134:8000' 'https://10.10.60.250'; 
            
            sub_filter_once off;
            sub_filter_types application/javascript text/css text/html;
        }

        # Route Auth requests directly to Keycloak container (UNTOUCHED)
        location /auth/ {
            proxy_pass http://keycloak:8080; 
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffer_size          128k;
            proxy_buffers            4 256k;
            proxy_busy_buffers_size    256k;
        }

        # Route Backend REST calls (UNTOUCHED)
        location /api/v1/ {
            proxy_pass http://api-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
