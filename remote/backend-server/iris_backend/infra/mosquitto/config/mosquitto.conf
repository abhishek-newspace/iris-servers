# --------------------------------------------------------------------------28-10-2025------------------------------------------------
# ==========================================
# MQTT over TLS listener
# ==========================================

# Local management listener
# listener 1884
# protocol mqtt
# allow_anonymous true

listener 8883
protocol mqtt

#plugins
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json


# ---- TLS Configuration ----
# Root CA: trusted by clients
cafile /mosquitto/certs/rootCA.crt.pem

# Broker chain (Broker + Intermediate)
certfile /mosquitto/certs/broker-chain.pem

# Broker's private key
keyfile /mosquitto/certs/broker.key.pem

# Optional: CRL if you are revoking leaf/intermediate certs
# crlfile /mosquitto/certs/intermediate.crl.pem

# ---- Client Authentication ----
require_certificate true
use_identity_as_username true
allow_anonymous false

# ---- Logging ----
log_dest stdout
log_type all

persistence true
persistence_location /var/lib/mosquitto/
# ==========================================
# MQTT over WebSockets (secure)
# ==========================================
listener 9001
protocol websockets

cafile /mosquitto/certs/rootCA.crt.pem
certfile /mosquitto/certs/broker-chain.pem
keyfile /mosquitto/certs/broker.key.pem

# Require mTLS for WebSocket connections as well
require_certificate true
use_identity_as_username true

