  # Local db
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    container_name: keycloak
    restart: unless-stopped
    command: start-dev

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/postgres
      
      KC_DB_USERNAME: postgres      
      KC_DB_PASSWORD: "12345"      
      KC_DB_SCHEMA: keycloak

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    volumes:
      - ./iris-theme-builder/my-theme-output:/opt/keycloak/themes
    networks:
      - iris
      
  # -------------------------------------------------
  # LOKI LOGS
  # -------------------------------------------------
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - iris


  # -------------------------------------------------
  # GRAFANA DASHBOARDS
  # -------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    user: "472:472"
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana_dash:/etc/grafana/provisioning:ro
    networks:
      - iris


# Local Registry
  registry:
    image: registry:2
    restart: always
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      # This maps your local Windows folder to the container's storage
      - ./data:/var/lib/registry
      

# -------------------------------------------------
# VOLUMES
# -------------------------------------------------
volumes:
  mosquitto_data:
  redis-data:
  postgres-data:
  pgadmin-data:
  loki_data:
  grafana_data:

# -------------------------------------------------
# NETWORK
# -------------------------------------------------
networks:
  iris:
    name: iris
    driver: bridge
