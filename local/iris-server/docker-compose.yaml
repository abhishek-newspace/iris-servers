services:

  # -------------------------------------------------
  # MQTT BROKER: Mosquitto (mTLS enabled)
  # -------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      - ./infra/mosquitto/data:/mosquitto/data
    environment:
      - TZ=Asia/Kolkata
    entrypoint: []
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    networks:
      - iris

  # -------------------------------------------------
  # FASTAPI BACKEND (Your pushed image)
  # -------------------------------------------------
  api-service:
    build:
      context: C:\Users\Abhishek.Kumar\Desktop\Iris-newspace\iris\iris_backend  # <---- Path to your Dockerfile directory
      dockerfile: Dockerfile  # Optional if it's named Dockerfile
    container_name: api-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/app/certs        # Persist robot certs
      - ./db:/app/db              # Persist DB (if SQLite or cert DB)
      - ./ota_packages:/app/ota_packages
    depends_on:
      mosquitto:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - iris

